<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fitvic</title>
    <!-- Tailwind CSS para estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel para interpretar JSX directamente en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Íconos de Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>

  <body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      // Definimos los hooks de React de forma global
      const { useState, useEffect, useMemo } = React;

      // Componente Principal Fitvic
      function App() {
        return (
          <div class="flex flex-col items-center justify-center min-h-screen p-4 text-center">
            <h1 class="text-3xl font-bold text-emerald-400 mb-2">Fitvic App</h1>
            <p class="text-slate-300">¡Tu aplicación ya está funcionando en Vercel!</p>
          </div>
        );
      }

      // Montamos el componente en el HTML
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
