        gender: 'female',
        weight: 68,
        height: 165,
        bodyFat: 26,
        goal: 'recomp',
        daysPerWeek: 4,
        theme: 'emerald',
        conditions: {
          lumbar: false,
          shoulder: false,
          knee: false,
          hypertension: false
        }
      };

      function BodyAnalysisApp() {
        const [formData, setFormData] = useState(() => {
          const saved = localStorage.getItem('fitvic_user_data');
          return saved ? JSON.parse(saved) : INITIAL_FORM_DATA;
        });

        const [completedSessions, setCompletedSessions] = useState(() => {
          const saved = localStorage.getItem('fitvic_weekly_progress');
          return saved ? JSON.parse(saved) : [];
        });

        const [selectedExerciseModal, setSelectedExerciseModal] = useState(null);

        useEffect(() => {
          localStorage.setItem('fitvic_user_data', JSON.stringify(formData));
        }, [formData]);

        useEffect(() => {
          localStorage.setItem('fitvic_weekly_progress', JSON.stringify(completedSessions));
        }, [completedSessions]);

        const theme = THEMES[formData.theme] || THEMES.emerald;

        // CÁLCULOS BIOMÉTRICOS
        const metrics = useMemo(() => {
          const weightKg = parseFloat(formData.weight) || 0;
          const heightM = (parseFloat(formData.height) || 100) / 100;
          const fatPct = (parseFloat(formData.bodyFat) || 0) / 100;

          const bmi = (weightKg / (heightM * heightM)).toFixed(1);
          const fatMassKg = (weightKg * fatPct).toFixed(1);
          const leanMassKg = (weightKg - fatMassKg).toFixed(1);
          const ffmi = (leanMassKg / (heightM * heightM)).toFixed(1);

          return { bmi, fatMassKg, leanMassKg, ffmi };
        }, [formData.weight, formData.height, formData.bodyFat]);

        // HANDLERS
        const handleInputChange = (e) => {
          const { name, value } = e.target;
          setFormData(prev => ({ ...prev, [name]: value }));
        };

        const handleCheckboxChange = (key) => {
          setFormData(prev => ({
            ...prev,
            conditions: { ...prev.conditions, [key]: !prev.conditions[key] }
          }));
        };

        const toggleSessionCompleted = (dayNum) => {
          setCompletedSessions(prev =>
            prev.includes(dayNum) ? prev.filter(d => d !== dayNum) : [...prev, dayNum]
          );
        };

        const resetProgress = () => {
          if (window.confirm('¿Reiniciar los entrenamientos marcados de esta semana?')) {
            setCompletedSessions([]);
          }
        };

        const handlePrint = () => {
          window.print();
        };

        // MOTOR DE ADAPTACIÓN DE EJERCICIOS POR SALUD
        const processedExercises = useMemo(() => {
          return EXERCISE_DATABASE.map(ex => {
            const hasConflict = ex.riskTags.some(tag => formData.conditions[tag]);
            if (hasConflict) {
              return {
                ...ex,
                isAdapted: true,
                originalName: ex.name,
                name: ex.safeAlternative || 'Ejercicio Adaptado de Seguridad'
              };
            }
            return { ...ex, isAdapted: false };
          });
        }, [formData.conditions]);

        const groupedExercises = useMemo(() => {
          const groups = { Empuje: [], Tracción: [], Pierna: [], Core: [], Cardio: [] };
          processedExercises.forEach(ex => {
            if (groups[ex.category]) groups[ex.category].push(ex);
          });
          return groups;
        }, [processedExercises]);

        return (
          <div className={`min-h-screen ${theme.bg} p-4 md:p-8 font-sans transition-colors duration-300 print:bg-white print:text-black print:p-0`}>
            
            <style>{`
              @media print {
                .no-print { display: none !important; }
                body { background: white !important; color: black !important; }
                .print-card { background: #f8fafc !important; border: 1px solid #cbd5e1 !important; color: black !important; page-break-inside: avoid; }
              }
            `}</style>

                <div className={`w-10 h-10 rounded-xl font-bold flex items-center justify-center ${theme.accentBg} text-slate-950`}>
                  FV
                </div>
                <div>
                  <h1 className={`text-2xl font-bold ${theme.accentText} tracking-wide print:text-black`}>Fitvic</h1>
                  <p className="text-xs text-slate-400 print:text-gray-600">Personal Trainer & Análisis Corporal Inteligente</p>
                </div>
              </div>

              <div className="flex items-center space-x-3 no-print">
                <div className="flex items-center space-x-1 bg-slate-800/80 p-1.5 rounded-xl border border-slate-700/60">
                  {Object.keys(THEMES).map(tKey => (
                    <button
                      key={tKey}
                      onClick={() => setFormData(prev => ({ ...prev, theme: tKey }))}
                      className={`px-2.5 py-1 rounded-lg text-xs font-semibold transition-all cursor-pointer ${
                        formData.theme === tKey
                          ? `${THEMES[tKey].accentBg} text-slate-950 shadow-md`
                          : 'text-slate-400 hover:text-white'
                      }`}
                    >
                      {THEMES[tKey].name.split(' ')[0]}
                    </button>
                  ))}
                </div>

                <button
                  onClick={handlePrint}
                  className={`${theme.accentBg} text-slate-950 font-bold text-xs px-3.5 py-2 rounded-xl transition-all shadow-md cursor-pointer`}
                >
                  📄 PDF / Imprimir
                </button>
              </div>
            </header>

            <main className="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">

                <div className={`${theme.card} rounded-2xl p-6 space-y-6 border no-print`}>

                  </h2>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Peso (kg)</label>

                        type="number"

                        value={formData.weight}
                        onChange={handleInputChange}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Altura (cm)</label>
                      <input
                        type="number"
                        name="height"
                        value={formData.height}
                        onChange={handleInputChange}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">% Grasa Est.</label>
                      <input
                        type="number"
                        name="bodyFat"
                        value={formData.bodyFat}
                        onChange={handleInputChange}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Días x Semana</label>
                      <select
                        name="daysPerWeek"
                        value={formData.daysPerWeek}
                        onChange={handleInputChange}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"
                      >
                        <option value={2}>2 días</option>
                        <option value={3}>3 días</option>
                        <option value={4}>4 días</option>
                        <option value={5}>5 días</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Objetivo Principal</label>
                    <select
                      name="goal"
                      value={formData.goal}
                      onChange={handleInputChange}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"

                      <option value="fat_loss">Pérdida de Grasa Preservando Músculo</option>
                      <option value="muscle">Hipertrofia / Ganancia Muscular</option>
                      <option value="recomp">Recomposición Corporal</option>

                    </select>
                  </div>

                  {/* PREVENCION Y SALUD */}

                        { key: 'shoulder', label: 'Molestia de Hombro / Manguito' },
                        { key: 'knee', label: 'Sensibilidad en Rodillas' },
                        { key: 'hypertension', label: 'Hipertensión Arterial' }

                        <label key={cond.key} className="flex items-center space-x-2 text-xs text-slate-300 cursor-pointer">
                          <input
                            type="checkbox"
                            checked={formData.conditions[cond.key]}
                            onChange={() => handleCheckboxChange(cond.key)}
                            className="rounded border-slate-700 bg-slate-900 text-emerald-500 focus:ring-emerald-500"
                          />
                          <span>{cond.label}</span>
                        </label>
                      ))}
                    </div>
                  </div>
                </div>

                {/* MÉTRICAS BIOMÉTRICAS */}
                <div className={`${theme.card} rounded-2xl p-6 border space-y-4`}>
                  <h2 className={`text-lg font-semibold ${theme.accentText} border-b border-slate-700/50 pb-2`}>
                    2. Diagnóstico Corporal
                  </h2>

                  <div className="grid grid-cols-2 gap-3 text-center">
                    <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-800">
                      <span className="block text-xs text-slate-400">IMC</span>
                      <span className="text-lg font-bold text-white">{metrics.bmi}</span>
                    </div>
                    <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-800">
                      <span className="block text-xs text-slate-400">Masa Magra</span>
                      <span className="text-lg font-bold text-white">{metrics.leanMassKg} kg</span>
                    </div>
                    <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-800">
                      <span className="block text-xs text-slate-400">Masa Grasa</span>
                      <span className="text-lg font-bold text-white">{metrics.fatMassKg} kg</span>
                    </div>
                    <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-800">
                      <span className="block text-xs text-slate-400">FFMI (Músculo)</span>
                      <span className="text-lg font-bold text-white">{metrics.ffmi}</span>
                    </div>
                  </div>
                </div>

                {/* TRACKER DE SESIONES SEMANALES */}
                <div className={`${theme.card} rounded-2xl p-6 border space-y-4 no-print`}>
                  <div className="flex justify-between items-center">
                    <h2 className={`text-lg font-semibold ${theme.accentText}`}>3. Progreso Semanal</h2>
                    <button onClick={resetProgress} className="text-xs text-slate-400 hover:text-white underline">
                      Reiniciar
                    </button>
                  </div>

                  <div className="grid grid-cols-4 gap-2">
                    {Array.from({ length: formData.daysPerWeek }, (_, i) => i + 1).map(day => {
                      const isDone = completedSessions.includes(day);
                      return (
                        <button
                          key={day}
                          onClick={() => toggleSessionCompleted(day)}
                          className={`p-3 rounded-xl border text-center transition-all cursor-pointer ${
                            isDone 
                              ? `${theme.accentBg} text-slate-950 font-bold border-transparent` 
                              : 'bg-slate-900/60 border-slate-800 text-slate-400 hover:border-slate-700'
                          }`}
                        >
                          <span className="block text-xs">Día</span>
                          <span className="text-base font-bold">{day}</span>
                          <span className="block text-[10px]">{isDone ? '✓ Listo' : 'Pendiente'}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>
              </section>

              {/* COLUMNA DERECHA: RUTINA DE EJERCICIOS ADAPTADA */}
              <section className="lg:col-span-8 space-y-6">
                <div className={`${theme.card} rounded-2xl p-6 border space-y-6`}>
                  <div className="flex justify-between items-center border-b border-slate-700/50 pb-3">
                    <div>
                      <h2 className={`text-xl font-bold ${theme.accentText}`}>Rutina de Entrenamiento Adaptada</h2>
                      <p className="text-xs text-slate-400">Basada en tu perfil físico y ajustes de articulaciones/salud</p>
                    </div>
                    <span className={`px-3 py-1 text-xs rounded-full border ${theme.badge}`}>
                      {formData.daysPerWeek} días / semana
                    </span>
                  </div>

                  {/* LISTADO POR CATEGORÍAS */}
                  {Object.keys(groupedExercises).map(category => {
                    const list = groupedExercises[category];
                    if (list.length === 0) return null;

                    return (
                      <div key={category} className="space-y-3">
                        <h3 className="text-sm font-bold text-slate-300 uppercase tracking-wider">{category}</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                          {list.map(ex => (
                            <div 
                              key={ex.id}
                              onClick={() => setSelectedExerciseModal(ex)}
                              className={`p-4 rounded-xl border ${theme.innerCard} hover:border-slate-600 transition-all cursor-pointer space-y-2`}
                            >
                              <div className="flex justify-between items-start">
                                <h4 className="font-semibold text-sm text-white">{ex.name}</h4>
                                <span className="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-300 font-mono">
                                  {ex.setsReps}
                                </span>
                              </div>

                              {ex.isAdapted && (
                                <div className="text-[11px] text-amber-400 bg-amber-500/10 border border-amber-500/20 px-2 py-1 rounded">
                                  ⚠️ Reemplaza a: <strong>{ex.originalName}</strong> (Cuidado articular)
                                </div>
                              )}

                              <p className="text-xs text-slate-400 line-clamp-2">{ex.tip}</p>
                            </div>
                          ))}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </section>
            </main>

            {/* MODAL DETALLE DE EJERCICIO */}
            {selectedExerciseModal && (
              <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 no-print">
                <div className={`${theme.card} border rounded-2xl max-w-lg w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto`}>
                  <div className="flex justify-between items-start border-b border-slate-700/50 pb-3">
                    <div>
                      <h3 className={`text-lg font-bold ${theme.accentText}`}>{selectedExerciseModal.name}</h3>
                      <span className="text-xs text-slate-400">{selectedExerciseModal.category} • {selectedExerciseModal.setsReps}</span>
                    </div>
                    <button 
                      onClick={() => setSelectedExerciseModal(null)}
                      className="text-slate-400 hover:text-white text-xl font-bold px-2"
                    >
                      ✕
                    </button>
                  </div>

                  <div>
                    <h4 className="text-xs font-bold text-slate-300 uppercase mb-2">Técnica Paso a Paso:</h4>
                    <ol className="list-decimal list-inside space-y-1.5 text-xs text-slate-300">
                      {selectedExerciseModal.steps.map((step, idx) => (
                        <li key={idx} className="leading-relaxed">{step}</li>
                      ))}
                    </ol>
                  </div>

                  <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-700/50">
                    <span className="block text-xs font-bold text-emerald-400 mb-1">💡 Consejo Técnico:</span>
                    <p className="text-xs text-slate-300">{selectedExerciseModal.tip}</p>
                  </div>

                  <button
                    onClick={() => setSelectedExerciseModal(null)}
                    className={`w-full py-2.5 rounded-xl text-xs font-bold text-slate-950 ${theme.accentBg} cursor-pointer`}
                  >
                    Entendido
                  </button>
                </div>
              </div>
            )}
          </div>
        );
      }

      // Montamos la aplicación React en el DOM
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<BodyAnalysisApp />);
    </script>
  </body>
</html>
